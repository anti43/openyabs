plugins {
    id 'java'
}

group = 'org.openyabs'
// release builds pass -PreleaseVersion=1.2.3 (see .github/workflows/build.yml)
version = findProperty('releaseVersion') ?: '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

dependencies {
    // relative to the project; the Mustang library and validator (e-invoices) are in lib/ as well
    implementation fileTree(dir: 'lib', include: ['*.jar'])
}

// Java 11 is the minimum (the Mustang e-invoice libraries need it); --release also
// checks that only Java 11 APIs are used when building with a newer JDK
tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}

// Using dependency list to generate a manifest with appropriate classpath
jar {
    archiveFileName = 'openyabs.jar'
    manifest {
        attributes 'Main-Class' : 'mpv5.Main'
        attributes 'Class-Path' : configurations.compileClasspath.collect { 'lib/' + it.getName() }.join(' ')
        attributes 'Add-Opens' : 'java.base/java.lang=ALL-UNNAMED'
    }
}

// Zip for distribution: openyabs/openyabs.jar, openyabs/lib/ and start scripts (src/dist).
// Start with yabs.sh / yabs.bat or "java -jar openyabs.jar" (Java 11+).
tasks.register('distributionZip', Zip) {
    group = 'distribution'
    description = 'Builds build/distributions/openyabs-<version>.zip with the app jar, lib/ and start scripts'
    archiveFileName = "openyabs-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('openyabs') {
        from(tasks.named('jar'))
        from('src/dist') {
            filesMatching('*.sh') {
                permissions { unix(0755) }
            }
        }
        from('README.md')
    }
    into('openyabs/lib') {
        from('lib') {
            exclude 'docs/**' // API docs, not needed at runtime
        }
    }
}
