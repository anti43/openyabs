plugins {
    id 'java'
}

group = 'org.openyabs'
// builds pass -PreleaseVersion (semantic versioning, see .github/workflows/build.yml):
// releases X.Y.Z, master builds <next patch>-dev.<build number> (e.g. 2.0.4-dev.250,
// older than the release 2.0.4); local builds are 2.0-dev
version = findProperty('releaseVersion') ?: '2.0-dev'

// the version shown in the application (splash screen, About, database update)
processResources {
    inputs.property('version', project.version)
    filesMatching('mpv5/version.properties') {
        expand(version: project.version)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // the application keeps its database connection in static fields: one JVM per test class
    forkEvery = 1
}

dependencies {
    // relative to the project; the Mustang library and validator (e-invoices) are in lib/ as well
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    // Groovy: scripts, the Groovy console and plugins written in Groovy
    implementation 'org.apache.groovy:groovy:4.0.24'
    implementation('org.apache.groovy:groovy-console:4.0.24') {
        exclude group: 'org.apache.ivy' // no @Grab downloads; the console works without it
    }
    // reads Fakturama 2 databases (HSQLDB) for the import
    implementation 'org.hsqldb:hsqldb:2.7.4'
    // H2: the default database of new installations (Derby is still supported)
    implementation 'com.h2database:h2:2.3.232'
    // PostgreSQL server databases
    implementation 'org.postgresql:postgresql:42.7.4'
    // MySQL / MariaDB servers (Connector/J 8.4 LTS; 5.1 can not talk to current servers)
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

// Plugins (plugins/<name>, Java): each directory with src/main/java becomes its own
// source set and jar (build/plugins/<name>.jar), compiled against YaBS. The jars are
// shipped in the plugins folder of the distribution, so users can import them
// (Control Panel > Plugins), and all together in openyabs-plugins-<version>.zip,
// a release asset for those who use an installer.
// jar names that differ from the directory name (kept for existing installations and docs)
def pluginJarNames = [gobd: 'gobd-compliance']
def pluginNames = (file('plugins').listFiles() ?: [] as File[])
        .findAll { it.isDirectory() && new File(it, 'src/main/java').isDirectory() }
        .collect { it.name }
        .sort()

pluginNames.each { name ->
    sourceSets.create(name) {
        java.srcDir "plugins/${name}/src/main/java"
        resources.srcDir "plugins/${name}/src/main/resources"
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
    // the tests (src/test) can test the plugins as well
    sourceSets.test.compileClasspath += sourceSets[name].output
    sourceSets.test.runtimeClasspath += sourceSets[name].output

    tasks.register("${name}PluginJar", Jar) {
        group = 'build'
        def jarName = (pluginJarNames[name] ?: name) + '.jar'
        description = "Builds build/plugins/${jarName}, the plugin in plugins/${name}"
        archiveFileName = jarName
        destinationDirectory = layout.buildDirectory.dir('plugins')
        from sourceSets[name].output
        manifest {
            attributes 'Implementation-Title' : "YaBS plugin ${name}"
            attributes 'Implementation-Version' : project.version
        }
    }
}
def pluginJarTasks = pluginNames.collect { tasks.named("${it}PluginJar") }

tasks.register('pluginJars') {
    group = 'build'
    description = 'Builds the jars of all plugins in plugins/ (build/plugins/*.jar)'
    dependsOn pluginJarTasks
}
tasks.named('assemble') { dependsOn 'pluginJars' }

// all plugin jars in one zip next to the distribution zip (release asset)
tasks.register('pluginsZip', Zip) {
    group = 'distribution'
    description = 'Builds build/distributions/openyabs-plugins-<version>.zip with all plugin jars'
    archiveFileName = "openyabs-plugins-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(pluginJarTasks)
}

// Java 21 is the minimum (Apache Derby 10.17 needs it); --release also
// checks that only Java 21 APIs are used when building with a newer JDK
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Using dependency list to generate a manifest with appropriate classpath
jar {
    archiveFileName = 'openyabs.jar'
    manifest {
        attributes 'Main-Class' : 'mpv5.Main'
        attributes 'Implementation-Title' : 'YaBS'
        attributes 'Implementation-Version' : project.version
        // runtimeClasspath: also the libraries only needed at runtime (JavaParser, ASM, groovy-swing etc.
        // of the Groovy console); with compileClasspath they were copied to lib/ but not found (NoClassDefFoundError)
        attributes 'Class-Path' : configurations.runtimeClasspath.collect { 'lib/' + it.getName() }.join(' ')
        attributes 'Add-Opens' : 'java.base/java.lang=ALL-UNNAMED'
    }
}

// "java -jar build/libs/openyabs.jar" works right after a build: the manifest
// points to lib/ next to the jar, so all runtime libraries are copied there
tasks.register('copyRuntimeLibs', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs/lib')
}
tasks.named('jar') { finalizedBy 'copyRuntimeLibs' }

// Zip for distribution: openyabs/openyabs.jar, openyabs/lib/ and start scripts (src/dist).
// Start with yabs.sh / yabs.bat or "java -jar openyabs.jar" (Java 21+).
tasks.register('distributionZip', Zip) {
    finalizedBy 'pluginsZip'
    group = 'distribution'
    description = 'Builds build/distributions/openyabs-<version>.zip with the app jar, lib/ and start scripts'
    archiveFileName = "openyabs-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('openyabs') {
        from(tasks.named('jar'))
        from('src/dist') {
            filesMatching('*.sh') {
                permissions { unix(0755) }
            }
        }
        from('README.md')
    }
    // plugins users can import (Control Panel > Plugins): all plugins in plugins/
    into('openyabs/plugins') {
        from(pluginJarTasks)
    }
    into('openyabs/lib') {
        from('lib') {
            exclude 'docs/**' // API docs, not needed at runtime
        }
        // the libraries from Maven (Groovy)
        from(configurations.runtimeClasspath.filter { !it.path.contains(file('lib').path) })
    }
}

// writes src/main/resources/db/schema.sql (the structure of new databases) from the
// Derby structure and all updates - run after adding a database update
tasks.register('generateSchema', JavaExec) {
    group = 'build'
    description = 'Writes src/main/resources/db/schema.sql from the database updates'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mpv5.db.common.SchemaExport'
    args = ['src/main/resources/db/schema.sql']
    systemProperty 'java.awt.headless', 'true'
}
