plugins {
    id 'java'
}

group = 'org.openyabs'
// builds pass -PreleaseVersion: 2.0.<build number>, or the version of the tag
// (see .github/workflows/build.yml); local builds are 2.0-dev
version = findProperty('releaseVersion') ?: '2.0-dev'

// the version shown in the application (splash screen, About, database update)
processResources {
    inputs.property('version', project.version)
    filesMatching('mpv5/version.properties') {
        expand(version: project.version)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // the application keeps its database connection in static fields: one JVM per test class
    forkEvery = 1
}

dependencies {
    // relative to the project; the Mustang library and validator (e-invoices) are in lib/ as well
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    // Groovy: scripts, the Groovy console and plugins written in Groovy
    implementation 'org.apache.groovy:groovy:4.0.24'
    implementation('org.apache.groovy:groovy-console:4.0.24') {
        exclude group: 'org.apache.ivy' // no @Grab downloads; the console works without it
    }
    // reads Fakturama 2 databases (HSQLDB) for the import
    implementation 'org.hsqldb:hsqldb:2.7.4'
    // H2: the default database of new installations (Derby is still supported)
    implementation 'com.h2database:h2:2.3.232'
    // PostgreSQL server databases
    implementation 'org.postgresql:postgresql:42.7.4'
    // MySQL / MariaDB servers (Connector/J 8.4 LTS; 5.1 can not talk to current servers)
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

// Java 21 is the minimum (Apache Derby 10.17 needs it); --release also
// checks that only Java 21 APIs are used when building with a newer JDK
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Using dependency list to generate a manifest with appropriate classpath
jar {
    archiveFileName = 'openyabs.jar'
    manifest {
        attributes 'Main-Class' : 'mpv5.Main'
        attributes 'Implementation-Title' : 'YaBS'
        attributes 'Implementation-Version' : project.version
        // runtimeClasspath: also the libraries only needed at runtime (JavaParser, ASM, groovy-swing etc.
        // of the Groovy console); with compileClasspath they were copied to lib/ but not found (NoClassDefFoundError)
        attributes 'Class-Path' : configurations.runtimeClasspath.collect { 'lib/' + it.getName() }.join(' ')
        attributes 'Add-Opens' : 'java.base/java.lang=ALL-UNNAMED'
    }
}

// "java -jar build/libs/openyabs.jar" works right after a build: the manifest
// points to lib/ next to the jar, so all runtime libraries are copied there
tasks.register('copyRuntimeLibs', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs/lib')
}
tasks.named('jar') { finalizedBy 'copyRuntimeLibs' }

// Zip for distribution: openyabs/openyabs.jar, openyabs/lib/ and start scripts (src/dist).
// Start with yabs.sh / yabs.bat or "java -jar openyabs.jar" (Java 21+).
tasks.register('distributionZip', Zip) {
    group = 'distribution'
    description = 'Builds build/distributions/openyabs-<version>.zip with the app jar, lib/ and start scripts'
    archiveFileName = "openyabs-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('openyabs') {
        from(tasks.named('jar'))
        from('src/dist') {
            filesMatching('*.sh') {
                permissions { unix(0755) }
            }
        }
        from('README.md')
    }
    into('openyabs/lib') {
        from('lib') {
            exclude 'docs/**' // API docs, not needed at runtime
        }
        // the libraries from Maven (Groovy)
        from(configurations.runtimeClasspath.filter { !it.path.contains(file('lib').path) })
    }
}

// writes src/main/resources/db/schema.sql (the structure of new databases) from the
// Derby structure and all updates - run after adding a database update
tasks.register('generateSchema', JavaExec) {
    group = 'build'
    description = 'Writes src/main/resources/db/schema.sql from the database updates'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mpv5.db.common.SchemaExport'
    args = ['src/main/resources/db/schema.sql']
    systemProperty 'java.awt.headless', 'true'
}
