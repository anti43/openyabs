<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Instantly redirects the browser to the new URL -->
    <meta http-equiv="refresh" content="0; url=https://anti43.github.io/openyabs">
    <title>Redirecting...</title>
    
    <!-- Fallback JavaScript redirect -->
    <script>
        window.location.href = "https://anti43.github.io/openyabs";
    </script>
</head>
<body>
    <!-- Fallback manual link for users with disabled scripts/meta redirects -->
    If you are not redirected automatically, <a href="https://anti43.github.io/openyabs">click here</a>.
</body>
</html>
