Y132_TITLE=Import aus YaBS 1.3.2 (Derby-Datenbank)
Y132_INTRO=\u00dcbernimmt alles aus einer alten YaBS-1.3.2-Datenbank: Kontakte, Adressen, Belege mit Positionen, Artikel, Ausgaben und Einnahmen, Konten, Steuers\u00e4tze, Benutzer mit Passw\u00f6rtern und Rechten, Gruppen, Einstellungen, Vorlagen, Dateien, Verlauf, Termine, Gespr\u00e4chsnotizen und mehr \u2013 mit Nummern, Datum und IDs. Die alte Datenbank wird nicht ver\u00e4ndert (eine Kopie wird gelesen). Die Daten der ge\u00f6ffneten Datenbank werden ersetzt: in eine neue, leere Datenbank importieren.
