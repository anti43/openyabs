ZUGFERD_INVALID_VATID=USt-IdNr. ist ung\u00fcltig, sie muss mit dem L\u00e4ndercode beginnen, z.B. DE123456789 (deutsche USt-IdNr.: DE + 9 Ziffern). Korrigieren unter Werkzeuge > Einstellungen > Firmeninformation > USt-IdNr.:
