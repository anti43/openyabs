ZUGFERD_BUYER_VATID_IGNORED=im Feld UST-ID steht keine g\u00fcltige USt-IdNr. (z.B. DE123456789), sie wird nicht in die E-Rechnung \u00fcbernommen. Eine Steuernummer ist in E-Rechnungen nicht zul\u00e4ssig - beim Kontakt im Feld UST-ID die USt-IdNr. des Kunden eintragen oder das Feld leeren:
ZUGFERD_HINT_VATID_PREFIX=Eine USt-IdNr. hat keinen g\u00fcltigen L\u00e4ndercode. Im Format DE123456789 eintragen: unter Werkzeuge > Einstellungen > Firmeninformation > USt-IdNr. und beim Kontakt im Feld UST-ID (nur USt-IdNr., keine Steuernummer).
ZUGFERD_HINT_SELLER_VATID=Ihre USt-IdNr. oder Steuernummer fehlt: unter Werkzeuge > Einstellungen > Firmeninformation eintragen (USt-IdNr. z.B. DE123456789, ohne USt-IdNr. die Steuernummer, z.B. 30/123/45678).
ZUGFERD_HINT_BUYER_TAXNUMBER=Beim Kontakt steht im Feld UST-ID eine Steuernummer. Erlaubt ist nur eine USt-IdNr. (z.B. DE123456789) - Kontakt korrigieren und die E-Rechnung neu erstellen.
ZUGFERD_HINT_SELLER_CONTACT=Kontaktdaten Ihrer Firma fehlen oder sind unvollst\u00e4ndig: Name, Telefon (mind. 3 Ziffern) und E-Mail unter Werkzeuge > Einstellungen > Firmeninformation eintragen.
ZUGFERD_HINT_SELLER_ADDRESS=Ihre Firmenadresse ist unvollst\u00e4ndig: Stra\u00dfe, PLZ, Ort und Land unter Werkzeuge > Einstellungen > Firmeninformation eintragen.
ZUGFERD_HINT_BUYER_ADDRESS=Die Rechnungsadresse des Kontakts ist unvollst\u00e4ndig: Stra\u00dfe, PLZ, Ort und Land beim Kontakt eintragen.
ZUGFERD_HINT_BUYER_REFERENCE=Die K\u00e4uferreferenz (Leitweg-ID) fehlt: der Rechnung oder dem Kontakt eine Eigenschaft 'leitweg-id' hinzuf\u00fcgen oder dem Kontakt eine Kundennummer geben.
ZUGFERD_HINT_IBAN=Bankverbindung fehlt oder ist ung\u00fcltig: g\u00fcltige IBAN (und BIC) unter Werkzeuge > Einstellungen > Firmeninformation eintragen.
ZUGFERD_HINT_PAYTERM=F\u00e4lligkeit / Zahlungsbedingungen fehlen: beim Kontakt eine Zahlungsbedingung (Tage) eintragen.
ZUGFERD_HINT_BUYER_EMAIL=Die E-Mail-Adresse oder Peppol-ID des Kontakts fehlt: beim Kontakt eintragen.
ZUGFERD_HINT_PEPPOL_ID=Die elektronische Adresse (Peppol-ID) fehlt oder hat einen ung\u00fcltigen EAS-Schemacode. Im Format <Schema>:<ID> eintragen, z.B. 0204:04011000-12345-34 oder 9930:DE123456789, oder leer lassen, um die E-Mail-Adresse zu verwenden.
ZUGFERD_HINT_EMPTY=Ein Feld enth\u00e4lt nur Leerzeichen. Firmeninformation und Kontakt auf Felder pr\u00fcfen, die nur Leerzeichen enthalten.
ZUGFERD_HINT_FONTS=Die Rechnungsvorlage verwendet eine Schrift, die nicht in das PDF eingebettet werden konnte. Schrift installieren (oder die Liberation- / DejaVu-Schriften) bzw. in der Vorlage eine andere Schrift verwenden - oder stattdessen eine XRechnung (XML) erstellen.
ZUGFERD_HINT_PDFA=Das aus der Rechnungsvorlage erzeugte PDF ist nicht PDF/A-3-konform. Vorlage vereinfachen (z.B. keine transparenten Bilder) oder stattdessen eine XRechnung (XML) erstellen.
