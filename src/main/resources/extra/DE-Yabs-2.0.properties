EINVOICE_TAB_INFO=Wie Rechnungen (auch Abschlags- und Anzahlungsrechnungen) diesem Kontakt per E-Mail gesendet werden - einzeln und im Serienversand. Angebote, Auftr\u00e4ge usw. werden immer als PDF gesendet. ZUGFeRD ist ein normal aussehendes PDF, das die E-Rechnung enth\u00e4lt - f\u00fcr Menschen und Buchhaltungssoftware geeignet. E-Rechnungen werden vor dem Versand gepr\u00fcft; eine unvollst\u00e4ndige oder ung\u00fcltige E-Rechnung wird nicht gesendet und der Grund angezeigt. Die Leitweg-ID verlangen \u00f6ffentliche Auftraggeber (XRechnung); ist sie leer, wird die Kundennummer verwendet. Die Peppol-ID setzt die elektronische Adresse des K\u00e4ufers (BT-49); ist sie leer, wird die E-Mail-Adresse verwendet. Wird mit dem Kontakt gespeichert.
