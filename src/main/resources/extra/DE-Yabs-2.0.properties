SCRIPTS_HELP=Skripte (Groovy) f\u00fcr eine Art von Datensatz (F\u00fcr) und eine Gruppe. \u201eAlle Belege\u201c = Rechnungen, Angebote, Auftr\u00e4ge, Gutschriften \u2026 zugleich; eine Gruppe schlie\u00dft ihre Untergruppen ein.\n\nWas ein Skript tut, h\u00e4ngt von seinem NAMEN ab (w\u00e4hlbar unter 'Verwenden als'):\n\n1. Beliebiger Name, z.B. anrede = ein Vorlagenfeld: <item.property.anrede> in Belegen, <item.contact.property.anrede> bei Kontaktskripten, <product.property.anrede> bei Artikeln. Beim Export steht dort das Ergebnis des Skripts. Die Daten werden NICHT ge\u00e4ndert.\n\n2. modifyOnSave = l\u00e4uft vor dem Speichern und kann die Daten \u00c4NDERN, z.B. dbo.setDescription(dbo.__getDescription().trim())\n   executeAfterSave / executeAfterCreate = nach dem Speichern / Anlegen, z.B. eine Benachrichtigung\n   modifyOnDelete = vor dem L\u00f6schen; eine Exception verhindert das L\u00f6schen\n\n3. IntItemLabel / IntRevenueLabel = Name von Belegen / Einnahmen in Listen, z.B. dbo.__getCnumber() + ' ' + dbo.__getCname()\n\nIm Skript: die Felder mit ihren Vorlagennamen, z.B. contact.cname, contact.ismale (Kontakte), item.cnumber, item.contact.cname, item.contact.property.anrede (Belege); dbo = der Datensatz, getObject('contact', 'name') = ein anderer Datensatz, getFormField('item.netvaluef') = ein Vorlagenfeld. Der letzte Wert ist das Ergebnis.\n\nTesten: Skript schreiben, 'Mit einem Datensatz testen...' f\u00fchrt es f\u00fcr einen gew\u00e4hlten Datensatz aus und zeigt seine Variablen.\nWerkzeugleisten-Aktionen (Schaltfl\u00e4che unten): eigene Schaltfl\u00e4chen in einer Werkzeugleiste, die ein Skript ausf\u00fchren.
