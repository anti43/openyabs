STOCK_HINT_INVENTORY=Die Inventur vergleicht den Bestand in YaBS ("Soll") mit dem, was wirklich im Regal liegt ("Gez\u00e4hlt").\n1. Optional: "Alle Artikel laden" listet alle Artikel als noch nicht gez\u00e4hlt, so sehen Sie, was noch fehlt.\n2. Z\u00e4hlen: jedes St\u00fcck scannen (jeder Scan +1) oder die gez\u00e4hlte Menge eintippen; 0 hei\u00dft keiner mehr da.\n3. "Differenz" pr\u00fcfen (gez\u00e4hlt minus Soll, rot wenn nicht 0) und die Liste aufbewahren: "CSV exportieren" / "HTML exportieren".\n4. "Bestand auf gez\u00e4hlt setzen" korrigiert den Bestand aller gez\u00e4hlten Artikel; nicht gez\u00e4hlte bleiben unver\u00e4ndert.
