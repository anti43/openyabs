SCRIPTS_VARS_ITEM=In the script: item.cnumber, item.netvalue, item.dateadded, item.contact.cname, item.contact.ismale, item.contact.property.NAME, item.property.NAME ... (raw values, e.g. true/false, numbers); dbo = the document, getFormField('item.netvaluef') = a formatted template field. 'Test with a record...' lists all.
