SCRIPTS_HELP=Scripts (Groovy) for a kind of record (For) and a group. 'All documents' = invoices, offers, orders, credit notes ... at once; a group includes its subgroups.\n\nWhat a script does depends on its NAME (choose it with 'Use as'):\n\n1. Any name, e.g. anrede = a template field: <item.property.anrede> in documents, <item.contact.property.anrede> for contact scripts, <product.property.anrede> for products. At export the result of the script appears there; the data is NOT changed.\n\n2. modifyOnSave = runs before saving and can CHANGE the data, e.g. dbo.setDescription(dbo.__getDescription().trim())\n   executeAfterSave / executeAfterCreate = after saving / creating, e.g. send a notice\n   modifyOnDelete = before deleting; throw an exception to stop it\n\n3. IntItemLabel / IntRevenueLabel = the name of documents / revenues in lists, e.g. dbo.__getCnumber() + ' ' + dbo.__getCname()\n\nIn a script: the fields by their template names, e.g. contact.cname, contact.ismale (contacts), item.cnumber, item.contact.cname, item.contact.property.anrede (documents); dbo = the record, getObject('contact', 'name') = another record, getFormField('item.netvaluef') = a template field. The last value is the result.\n\nTest: write the script, 'Test with a record...' runs it on a record you choose and lists its variables.\nToolbar actions (button below): own buttons in a toolbar that run a script.
SCRIPTS_LIST=Scripts
SCRIPTS_LIST_HINT=One script for 'All documents' works for invoices, offers, orders, credit notes ... at once - no copy per type needed. A script for a type or a group is added to it (a field of the same name: the more specific one wins).
