PRIVACY_TITLE=Delete contact - data protection
PRIVACY_INTRO=%s can not be deleted: documents must be kept until %s. Instead, all other personal data is deleted and the contact is blocked.
PRIVACY_INTRO_BLOCKED=%s is blocked: the remaining data is kept only because documents must be kept until %s.
PRIVACY_LAW=Invoices and booking records must be kept for 8 years, business letters (orders, order confirmations, delivery notes, accepted offers) for 6 years, from the end of the calendar year. They must not be changed (GoBD), so the name and the addresses of the contact, which the documents show, stay. GDPR: the right to erasure does not apply to them; they are blocked and may only be used for the retention, e.g. for a tax audit. The periods can be longer while a tax assessment is still open - ask your tax adviser if in doubt.
