SCRIPTS_HELP=Scripts (Groovy) for a kind of record (left: For) and a group.\n\nWhat a script does depends on its NAME (choose it with 'Use as'):\n\n1. Any name, e.g. greeting = a template field. In ODT templates write <item.property.greeting> (contacts: <contact.property.greeting>); at export the result of the script appears there. The data is NOT changed.\n\n2. modifyOnSave = runs before saving and can CHANGE the data, e.g. dbo.setDescription(dbo.__getDescription().trim())\n   executeAfterSave / executeAfterCreate = after saving / creating, e.g. send a notice\n   modifyOnDelete = before deleting; throw an exception to stop it\n\n3. IntItemLabel / IntRevenueLabel = the name of documents / revenues in lists, e.g. dbo.__getCnumber() + ' ' + dbo.__getCname()\n\nIn a script: dbo = the record, getObject('contact', 'name') = another record, getFormField('item.netvaluef') = a template field. The last value is the result.\n\nTest: write the script, 'Test with a record...' runs it on a record you choose.\nToolbar actions (button below): own buttons in a toolbar that run a script.
