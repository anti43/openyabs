# YaBS modern look and feel: FlatLaf light, but "not too flat".
# See https://www.formdev.com/flatlaf/properties-files/

@accentColor = #2563eb
@background = #eef0f4

#---- general ----
Component.arc = 8
TextComponent.arc = 6
Component.focusWidth = 2
Component.innerFocusWidth = 0
Component.borderColor = #b9c0cb
Component.disabledBorderColor = #d3d7de
Component.focusedBorderColor = lighten(@accentColor,10%)
Component.focusColor = fade(@accentColor,35%)
Component.arrowType = chevron

#---- buttons: light gradient, outline and a soft shadow ----
Button.arc = 8
Button.borderWidth = 1
Button.margin = 3,12,3,12
Button.startBackground = #ffffff
Button.endBackground = #e9ecf1
Button.hoverBackground = #f5f8fd
Button.pressedBackground = #dde2ea
Button.startBorderColor = #c4cad4
Button.endBorderColor = #a9b0bc
Button.hoverBorderColor = lighten(@accentColor,20%)
Button.paintShadow = true
Button.shadowWidth = 1
Button.shadowColor = #00000022

Button.default.startBackground = lighten(@accentColor,8%)
Button.default.endBackground = darken(@accentColor,4%)
Button.default.hoverBackground = lighten(@accentColor,4%)
Button.default.pressedBackground = darken(@accentColor,10%)
Button.default.focusedBackground = @accentColor
Button.default.focusColor = fade(@accentColor,45%)
Button.default.foreground = #ffffff
Button.default.startBorderColor = darken(@accentColor,4%)
Button.default.endBorderColor = darken(@accentColor,14%)
Button.default.focusedBorderColor = darken(@accentColor,14%)
Button.default.boldText = true
Button.default.shadowColor = #1e40af44

ToggleButton.startBackground = $Button.startBackground
ToggleButton.endBackground = $Button.endBackground
ToggleButton.selectedBackground = #d6e2fb
ToggleButton.selectedForeground = darken(@accentColor,20%)

#---- toolbars ----
ToolBar.background = #f6f7f9
ToolBar.borderMargins = 3,4,3,4
Button.toolbar.hoverBackground = #dfe6f3
Button.toolbar.pressedBackground = #cbd6ea
Button.toolbar.selectedBackground = #d6e2fb
Button.toolbar.margin = 4,4,4,4
Button.toolbar.spacingInsets = 1,2,1,2

#---- text fields, combo boxes, spinners ----
Spinner.buttonBackground = #f1f3f6
TextComponent.selectionBackground = #c9daf8
TextComponent.selectionForeground = #000000
# dropdowns: own colors (not the desktop's, e.g. a dark GTK theme on Linux), selection like lists
ComboBox.background = #ffffff
ComboBox.foreground = #1b2330
ComboBox.popupBackground = #ffffff
ComboBox.selectionBackground = #d6e2fb
ComboBox.selectionForeground = #0b1f44
ComboBox.disabledForeground = #8a93a2
List.background = #ffffff
List.foreground = #1b2330

#---- check boxes / radio buttons ----
CheckBox.arc = 4
CheckBox.icon.borderColor = #a9b0bc
CheckBox.icon.selectedBorderColor = darken(@accentColor,6%)
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.selectedBackground = @accentColor

#---- menus and popups ----
Popup.dropShadowPainted = true
PopupMenu.borderInsets = 5,1,5,1
PopupMenu.borderColor = #c4cad4
MenuBar.background = #f6f7f9
MenuBar.borderColor = #d3d8e0
MenuItem.selectionBackground = #dbe6fb
MenuItem.selectionForeground = #102a5c
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
Menu.selectionBackground = $MenuItem.selectionBackground
Menu.selectionForeground = $MenuItem.selectionForeground
MenuBar.selectionBackground = #dbe6fb
MenuBar.selectionArc = 6
ToolTip.background = #fdfdfe
ToolTip.border = 5,8,5,8,#b9c0cb,1,8

#---- tables, lists, trees ----
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.gridColor = #e4e7ec
Table.rowHeight = 24
Table.selectionBackground = #d6e2fb
Table.selectionForeground = #0b1f44
Table.selectionInactiveBackground = #e6ebf3
Table.selectionInactiveForeground = #0b1f44
Table.alternateRowColor = #f8f9fb
TableHeader.background = #f1f3f6
TableHeader.bottomSeparatorColor = #c4cad4
TableHeader.separatorColor = #dadee5
TableHeader.height = 26
List.selectionBackground = $Table.selectionBackground
List.selectionForeground = $Table.selectionForeground
List.selectionInactiveBackground = $Table.selectionInactiveBackground
List.selectionInactiveForeground = $Table.selectionInactiveForeground
Tree.selectionBackground = $Table.selectionBackground
Tree.selectionForeground = $Table.selectionForeground
Tree.selectionInactiveBackground = $Table.selectionInactiveBackground
Tree.selectionInactiveForeground = $Table.selectionInactiveForeground
Tree.rowHeight = 22
Tree.selectionArc = 6

#---- scroll bars ----
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.thumb = #c2c8d2
ScrollBar.hoverThumbColor = #a9b0bc
ScrollBar.pressedThumbColor = #8f97a5
ScrollBar.track = #f1f3f6
ScrollBar.showButtons = false
ScrollPane.border = 1,1,1,1,#c4cad4
ScrollPane.arc = 0

#---- tabbed panes (classic panels; the main tabs use their own UI) ----
TabbedPane.tabHeight = 30
TabbedPane.tabInsets = 4,12,4,12
TabbedPane.selectedBackground = #ffffff
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = #9fb7e9
TabbedPane.hoverColor = #e3e8f0
TabbedPane.contentAreaColor = #c4cad4
TabbedPane.showTabSeparators = true
TabbedPane.tabSeparatorColor = #d3d8e0

#---- titled borders: the headings of the classic forms ----
TitledBorder.titleColor = #2b3546
TitledBorder.border = 1,1,1,1,#cfd4dc

#---- split panes, progress bars, sliders ----
SplitPane.dividerSize = 7
SplitPaneDivider.gripColor = #a9b0bc
ProgressBar.arc = 999
ProgressBar.foreground = @accentColor
Slider.thumbColor = @accentColor
Slider.trackValueColor = @accentColor

#---- dialogs ----
OptionPane.buttonMinimumWidth = 80
OptionPane.messagePadding = 4
TitlePane.unifiedBackground = true
