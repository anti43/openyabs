# Builds YaBS, runs the tests and publishes the distribution zip
# (openyabs.jar, lib/, start scripts) and installers with their own Java
# runtime (.deb, .rpm, .msi, .dmg; src/packaging/build-installer.sh):
# Published as workflow artifacts (Actions > run > Artifacts); installers
# not for pull requests. GitHub releases are published only by release.yml.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Version selected by the Release workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags, for the version of master builds

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Java 21 is the minimum (options.release = 21, Derby 10.17)

      - uses: gradle/actions/setup-gradle@v4

      # the ZUGFeRD PDF test needs an installed font family to embed (PDF/A-3)
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation

      # Use the release version, tag version or a pre-release version of the next patch.
      - name: Test and build distribution zip
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            ./gradlew --no-daemon test distributionZip -PreleaseVersion="$RELEASE_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew --no-daemon test distributionZip -PreleaseVersion="${GITHUB_REF_NAME#v}"
          else
            # semantic versioning: a pre-release of the next patch after the latest
            # release tag (2.0.3 -> 2.0.4-dev.<build number>), so releases compare right
            latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
            IFS=. read -r major minor patch <<< "${latest:-2.0.-1}"
            ./gradlew --no-daemon test distributionZip -PreleaseVersion="${major}.${minor}.$((patch + 1))-dev.${GITHUB_RUN_NUMBER}"
          fi

      # the artifact download is itself a zip which contains openyabs-<version>.zip;
      # uploading the zip (and not the folder) keeps yabs.sh executable
      - uses: actions/upload-artifact@v4
        with:
          name: openyabs-${{ github.run_number }}
          # the zip and the GoBD plugin (gobd-compliance.jar, also a release asset)
          path: |
            build/distributions/*.zip
            build/distributions/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ github.run_number }}
          path: build/reports/tests/
          if-no-files-found: ignore

  installers:
    needs: build
    # not for pull requests (slow); for master, version tags and manual runs
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # built on the oldest supported Ubuntu: the package dependencies
          # (e.g. libasound2) then also fit Debian 12 and Ubuntu 22.04+
          - os: ubuntu-22.04
            types: deb rpm
          # jpackage of Java 21 needs WiX Toolset 3
          - os: windows-2022
            types: msi
          # macOS: Apple silicon and Intel (not signed)
          #- os: macos-14
          #  types: dmg
          #- os: macos-15-intel
          #  types: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags, for the version of master builds

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: openyabs-${{ github.run_number }}
          path: build/distributions

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: WiX Toolset 3 on the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
          }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # installer versions: releases and tags X.Y.Z (v2.1.0 -> 2.1.0). Master builds
      # must rank below the next release, as the application (2.0.4-dev.250):
      # deb and rpm get 2.0.4~dev250 ("~" sorts before the release in dpkg and
      # rpm); MSI and macOS only take numbers and get the latest release
      # (2.0.3), so every following release installs as an update
      - name: Build installers
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            linux="$RELEASE_VERSION"; numeric="$RELEASE_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            linux="${GITHUB_REF_NAME#v}"; linux="${linux%%-*}"; numeric="$linux"
          else
            latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
            IFS=. read -r major minor patch <<< "${latest:-2.0.-1}"
            linux="${major}.${minor}.$((patch + 1))~dev${GITHUB_RUN_NUMBER}"
            numeric="${latest:-2.0.0}"
          fi
          mkdir -p dist
          for type in ${{ matrix.types }}; do
            case "$type" in
              deb|rpm) version="$linux" ;;
              *) version="$numeric" ;;
            esac
            src/packaging/build-installer.sh "$type" "$version"
            cp build/installer/out/* dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
